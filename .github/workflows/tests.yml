---
# Test workflow — consumes the shared Python quality gate
# from build-common (legacy toolchain: flake8 + pylint).
#
# NOTE: This branch temporarily points at the build-common
# PR branch for integration testing.  Before merging,
# update the ref to the merged SHA on main.
name: Test

permissions:
  contents: read

"on":
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened]
    branches:
      - main

jobs:
  test:
    if: >
      (github.event_name == 'push' &&
       github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'main')
    # yamllint disable-line rule:line-length
    uses: cognizant-ai-lab/build-common/.github/workflows/_python-quality-gate.yml@devin/1771545839-python-quality-gate-abstraction
    with:
      # Point at the build-common PR branch for testing.
      # Replace with "main" (or remove) before merging.
      build-common-ref: "devin/1771545839-python-quality-gate-abstraction"
      lint-toolchain: "legacy"
      python-version: "3.12"
      sources: "."
      pylint-command: "build_scripts/run_pylint.sh"
      shellcheck-command: "build_scripts/run_shellcheck.sh"
      run-markdownlint: true
      markdownlint-command: "build_scripts/run_markdownlint.sh"
      check-readme-pypi: true
      # The server_start.sh script must run before pytest,
      # and custom env vars are needed, so we use the
      # test-command-override escape hatch.
      test-command-override: >-
        AGENT_TOOL_PATH="./neuro_san/coded_tools"
        PYTHONPATH="."
        bash -c "build_scripts/server_start.sh &&
        pytest --verbose
        -m 'not integration and not smoke'
        --timer-top-n 10 -n auto
        --cov-config=.coveragerc --cov"
      pytest-extra-args: ""
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
