name: Smoke Tests

permissions:
    contents: read

on:
  schedule:
    - cron: '0 12 * * *'  # 12:00 PM UTC = 4:00 AM PT (standard)
  workflow_dispatch:      # enables manual triggering

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            ${{ vars.AWS_REGION }}
    
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434

    # don't run this job in sync'd clones
    if: github.repository == 'cognizant-ai-lab/neuro-san'
    container:
      image: python:3.12-slim

    steps:
      # v4.3.1
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check for NVIDIA GPU
        shell: bash
        run: |
          build_scripts/check_gpu.sh
      
      - name: Check available memory
        shell: bash
        run: |
          build_scripts/check_memory.sh

      - name: Install dependencies
        run: |
          apt-get update && apt-get install --yes curl shellcheck
          pip install -r requirements-build.txt
          pip install -r requirements.txt

      - name: Set Ollama model to be used for related test case
        shell: bash
        run: |
          build_scripts/set_ollama_model.sh

      - name: Check access to Bedrock models
        shell: bash
        run: |
          build_scripts/check_list_bedrock_models_profile_single.sh
      
      - name: Show installed packages
        run: pip freeze

      - name: Start server and run smoke tests
        id: smoke
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION }}
          AGENT_TOOL_PATH: "./neuro_san/coded_tools"
          PYTHONPATH: ${{ env.PYTHONPATH }}:.
        run: |
          build_scripts/server_start.sh
 
          set +e
          pytest --capture=no --verbose -m "smoke" --timer-top-n 100 -n auto 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
 
          summary=$(tail --lines=20 pytest_output.txt | grep -E '(passed|failed|error)' | tail --lines=1)
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
 
          if [ "$exit_code" -ne 0 ]; then
            echo "===================================================="
            echo "===================================================="
            echo "=== Server_Sevice_Agent.LOG ==="
            cat agent.log || echo "(no agent.log found)"
            echo "===================================================="
            exit 1
          fi

      - name: Notify Slack
        if: ${{ !cancelled() }}
        # 1.0.8
        uses: cognizant-ai-lab/build-common/actions/slack-notify@30321843331e00848309b34e08b839e1f6490ba2
        with:
          status: ${{ job.status }}
          details: ${{ steps.smoke.outputs.summary }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
