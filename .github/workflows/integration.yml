name: Integration

permissions:
    contents: read

on:
  schedule:
    - cron: '0 12 * * *'  # 12:00 PM UTC = 4:00 AM PT (standard)
  workflow_dispatch:      # enables manual triggering

jobs:
  test:
    # don't run this job in sync'd clones
    if: github.repository == 'cognizant-ai-lab/neuro-san'
    # 1.0.7
    uses: cognizant-ai-lab/build-common/.github/workflows/_python-quality-gate.yml@3ead7f681f92044709ffc3a533f41c3f48230cfd
    with:
      python-version: '3.12'
      lint-command-override: 'true'  # no lint in this workflow
      run-pytest: false
      test-command-override: >-
        export AGENT_TOOL_PATH="./neuro_san/coded_tools" &&
        export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}." &&
        export AGENT_MANIFEST_FILE="./neuro_san/registries/manifest.hocon" &&
        pytest --capture=no --verbose -m "integration" --timer-top-n 100
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
