name: Checkmarx One Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  checkmarx-scan:
    runs-on: ubuntu-latest
    if: github.repository == 'cognizant-ai-lab/neuro-san'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkmarx One Scan
        uses: checkmarx/ast-github-action@2.3.30
        with:
          base_uri: ${{ vars.CX_BASE_URI }}
          cx_tenant: ${{ secrets.CX_TENANT }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          additional_params: --report-format sarif --output-path .

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cx_result.sarif

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Checkmarx Scan Passed for `${{ github.repository }}` on `${{ github.ref_name }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Checkmarx Scan Failed for `${{ github.repository }}` on `${{ github.ref_name }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
